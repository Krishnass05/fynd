<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Dashboard | Fynd ScopeDesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'floral-white': '#FFFCF2',
            'silver': '#CCC5B9',
            'charcoal-brown': '#403D39',
            'carbon-black': '#252422',
            'spicy-paprika': '#EB5E28',
          },
          fontFamily: {
            sans: ['Manrope', 'sans-serif'],
            display: ['Fraunces', 'serif'],
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --floral-white: #FFFCF2;
      --silver: #CCC5B9;
      --charcoal-brown: #403D39;
      --carbon-black: #252422;
      --spicy-paprika: #EB5E28;
    }
    body {
      background-color: #FFFCF2;
      color: #252422;
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid #CCC5B9;
      background: #FFFCF2;
      color: #403D39;
    }
    .badge-paprika {
      background: #EB5E28;
      color: #FFFFFF;
      border-color: #EB5E28;
    }
    .badge-carbon {
      background: #252422;
      color: #FFFCF2;
      border-color: #252422;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .btn-primary {
      background-color: #EB5E28;
      color: #FFFFFF;
      border: 1px solid #EB5E28;
    }
    .btn-primary:hover {
      background-color: #252422;
      border-color: #252422;
    }
    .btn-secondary {
      background-color: #FFFCF2;
      color: #252422;
      border: 1px solid #CCC5B9;
    }
    .btn-secondary:hover {
      background-color: #CCC5B9;
    }
    .btn-dark {
      background-color: #252422;
      color: #FFFCF2;
      border: 1px solid #252422;
    }
    .btn-dark:hover {
      background-color: #403D39;
    }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="min-h-screen bg-floral-white flex flex-col">
  <!-- Global Top Bar -->
  <header class="border-b border-silver bg-white px-6 py-3">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="../../../index.html" class="font-display font-bold text-xl text-carbon-black tracking-tight flex items-center gap-2">
          <span>Fynd ScopeDesk</span>
        </a>
        <span class="badge badge-carbon">[Standalone HTML]</span>
      </div>
      <nav class="flex items-center gap-4 text-xs font-semibold">
        <a href="../../../index.html" class="text-charcoal-brown hover:text-spicy-paprika">Main App</a>
        <a href="../../../app/(client)/client/page.html" class="text-charcoal-brown hover:text-spicy-paprika">Client Portal</a>
        <a href="../../../app/(freelancer)/freelancer/page.html" class="text-charcoal-brown hover:text-spicy-paprika">Freelancer Portal</a>
        <a href="../../../components/workspace/UnifiedWorkspace.html" class="text-charcoal-brown hover:text-spicy-paprika">Unified Workspace</a>
      </nav>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-6">
    <div id="root">
      
    </div>
  </main>

  <footer class="border-t border-silver bg-white text-center py-4 text-xs text-charcoal-brown">
    <div class="max-w-7xl mx-auto flex items-center justify-between px-6">
      <span>Fynd ScopeDesk - Standalone View</span>
      <span>5-Color Palette: Floral White, Silver, Charcoal Brown, Carbon Black, Spicy Paprika</span>
      <span>Zero Emojis</span>
    </div>
  </footer>

            </div>

            <div class="border border-silver rounded-xl p-4 flex items-center justify-between">

                <div class="flex items-center gap-2 mb-1">

    ReactDOM.render(<ClientDashboard />, document.getElementById('root'));
  
</script>
</body>
</html>
